<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sydney Events Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" />

  <!-- Your external stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Sydney Events</a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <!-- Categories (left) -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="category-filter"></ul>

        <!-- Search bar (right) -->
        <form class="d-flex ms-auto align-items-center"
              role="search"
              id="event-search-form">
          <div class="input-group input-group-sm search-container">
            <span class="input-group-text search-icon">
              <!-- Magnifying Glass Icon -->
              <svg xmlns="http://www.w3.org/2000/svg"
                   width="15" height="15"
                   fill="#6c757d"
                   viewBox="0 0 16 16">
                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398l3.85 
                  3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85zm-5.242 
                  1.31a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
              </svg>
            </span>

            <input
              class="form-control"
              type="search"
              placeholder="Search events..."
              aria-label="Search events"
              id="event-search-input"
            />
          </div>
        </form>
      </div>
    </div>
  </nav>

  <!-- Map -->
  <div id="map"></div>

  <!-- Sidebar -->
  <div id="sidebar">
    <h4>Events</h4>
    <div id="event-list"></div>
    <div id="event-details" style="margin-top:20px;"></div>
  </div>

  <!-- Map legend -->
  <div id="map-legend" class="map-legend">
    <h6 class="legend-title mb-1">Categories</h6>
    <div class="legend-item">
      <span class="legend-swatch legend-music"></span>Music
    </div>
    <div class="legend-item">
      <span class="legend-swatch legend-food"></span>Food
    </div>
    <div class="legend-item">
      <span class="legend-swatch legend-community"></span>Community
    </div>
    <div class="legend-item">
      <span class="legend-swatch legend-art"></span>Art
    </div>
  </div>

  <!-- JS: Leaflet, Bootstrap, Fuse, App -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <script src="script.js"></script>
</body>
</html>
